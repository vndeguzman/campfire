<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Emperor Has No Clothes - Crayon Storyteller & Local AI</title>
  
  <link rel="manifest" id="pwa-manifest" />
  <meta name="theme-color" content="#d97706" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Core CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin="anonymous"></script>
  
  <!-- Load WebLLM as an ES Module into global scope -->
  <script type="module">
    import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.46/+esm";
    window.webllm = webllm;
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap');
    body { font-family: 'Quicksand', sans-serif; touch-action: manipulation; user-select: none; }
    .font-handwriting { font-family: 'Fredoka', cursive; }
  </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex flex-col justify-between overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STORY_SCENES = [
      { id: 1, title: "The Vain Emperor", text: "Many years ago, there lived an Emperor who loved fine clothes more than anything else.", palette: { bg: "#fef3c7", primary: "#d97706", accent: "#b45309", sky: "#bae6fd" } },
      { id: 2, title: "The Two Swindlers", text: "One day, two crafty swindlers came to the city. They claimed they could weave a fabric so miraculous that it was completely invisible to foolish people.", palette: { bg: "#fef9c3", primary: "#ca8a04", accent: "#a16207", sky: "#e0f2fe" } }
    ];

    function App() {
      const [aiEngine, setAiEngine] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);
      const [aiProgress, setAiProgress] = useState("");
      const [gpuSupported, setGpuSupported] = useState(true);

      useEffect(() => {
        if (!navigator.gpu) {
          setGpuSupported(false);
          setAiProgress("WebGPU is not enabled in your browser. Enable 'Unsafe WebGPU' in chrome://flags or use Chrome/Edge on Desktop.");
        }
      }, []);

      const initializeLocalAI = async () => {
        if (!navigator.gpu) {
          alert("WebGPU is not supported on this browser or device.");
          return;
        }

        setAiLoading(true);
        setAiProgress("Initializing engine...");

        try {
          const webllm = window.webllm;
          if (!webllm) throw new Error("WebLLM module is still loading. Please wait 5 seconds and try again.");

          const selectedModel = "SmolLM2-360M-Instruct-q4f16-MLC";
          const engine = await webllm.CreateMLCEngine(selectedModel, {
            initProgressCallback: (report) => {
              setAiProgress(report.text);
            }
          });

          setAiEngine(engine);
          setAiLoading(false);
        } catch (err) {
          console.error("Local AI Error:", err);
          setAiLoading(false);
          setAiProgress("Initialization error: " + err.message);
        }
      };

      return (
        <div className="p-6 max-w-sm mx-auto space-y-4">
          <h2 className="font-handwriting text-xl text-amber-900 font-bold">Offline Story AI</h2>
          
          <div className="p-4 bg-white rounded-2xl border border-amber-300 space-y-3">
            <p className="text-xs font-bold text-amber-900">Local AI Engine Status</p>
            <p className="text-xs text-slate-600">{aiProgress || "Ready to initialize local LLM."}</p>
            
            <button
              onClick={initializeLocalAI}
              disabled={aiLoading || !gpuSupported}
              className="w-full py-2 bg-amber-600 text-white text-xs font-bold rounded-xl disabled:opacity-50 hover:bg-amber-700"
            >
              {aiLoading ? "Loading Model..." : "Initialize Local AI"}
            </button>
          </div>
        </div>
      );
    }

    // Fixed: Correct DOM attachment without undeclared variable
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
